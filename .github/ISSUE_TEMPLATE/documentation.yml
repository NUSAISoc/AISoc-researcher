name: Documentation change
description: Propose a correction or improvement to contributor, research, or operational documentation.
title: "docs: "
body:
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Link the current text and explain what a reader cannot do or understand.
    validations:
      required: true
  - type: textarea
    id: synchronization
    attributes:
      label: Canonical boundary and synchronization
      description: Identify the owning document and any related targets, or state why this is non-research documentation.
    validations:
      required: true
