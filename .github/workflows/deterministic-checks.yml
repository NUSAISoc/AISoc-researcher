name: Deterministic Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  research-harness:
    name: Research harness checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to a full commit SHA so a moved tag cannot silently change
        # the executed action. Dependabot keeps the digest current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run deterministic checks
        run: ./.beryl/scripts/check.sh

      - name: Run Python harness tests
        run: python3 -m unittest discover -s tests -t .
